<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Web Core</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; padding: 12px; background: #0c0f14; color: #e6edf7; }
    .bar { display: flex; gap: 8px; margin-bottom: 10px; }
    input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #263042; background: #141a23; color: #e6edf7; }
    button { padding: 10px 14px; border-radius: 8px; border: 0; background: #10b981; color: #06100c; font-weight: 700; cursor: pointer; }
    button.sec { background: #2563eb; color: #ffffff; }
    pre { white-space: pre-wrap; word-break: break-word; background: #121720; border: 1px solid #222b3a; padding: 10px; border-radius: 8px; font-size: 12px; min-height: 120px; }
    .res { margin-top: 8px; padding: 10px; border-radius: 8px; background: #131924; border: 1px solid #1f293a; }
    a { color: #38bdf8; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="bar">
    <input id="q" type="text" placeholder="Zapytanie Web / AI lub URL..." />
    <button onclick="doSearch()">SEARCH</button>
    <button class="sec" onclick="doAi()">AI</button>
  </div>
  <div id="out"><pre id="log">Bridge ready. Waiting for command.</pre></div>
  <script>
    function hasBridge() { return typeof window.AndroidNative !== "undefined"; }
    function writeLog(txt) { document.getElementById("log").textContent = txt; }
    function doSearch() {
      const q = document.getElementById("q").value.trim();
      if (!q) return;
      if (q.startsWith("http://") || q.startsWith("https://")) { location.href = q; return; }
      if (!hasBridge()) { writeLog("Bridge AndroidNative unavailable."); return; }
      try {
        const raw = window.AndroidNative.webSearch(q, 8);
        const data = JSON.parse(raw);
        const items = Array.isArray(data.results) ? data.results : [];
        const container = document.getElementById("out");
        container.innerHTML = "";
        if (!items.length) { container.innerHTML = '<pre id="log">' + JSON.stringify(data, null, 2) + "</pre>"; return; }
        items.forEach(r => {
          const div = document.createElement("div");
          div.className = "res";
          div.innerHTML = '<div><a href="' + (r.url || "#") + '">' + (r.title || r.url || "Result") + "</a></div><div>" + (r.snippet || "") + "</div>";
          container.appendChild(div);
        });
      } catch (e) { writeLog("ERR: " + e.message); }
    }
    function doAi() {
      const q = document.getElementById("q").value.trim() || "ping";
      if (!hasBridge()) { writeLog("Bridge AndroidNative unavailable."); return; }
      try {
        const raw = window.AndroidNative.askAi(q, true);
        const data = JSON.parse(raw);
        writeLog(data.content || JSON.stringify(data, null, 2));
      } catch (e) { writeLog("ERR: " + e.message); }
    }
  </script>
</body>
</html>
