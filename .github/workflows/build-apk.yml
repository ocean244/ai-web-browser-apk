name: Build AI Browser APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Stage APK for Release
        run: |
          mkdir -p dist
          APK_FOUND=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          test -n "$APK_FOUND"
          cp "$APK_FOUND" dist/AIBrowser-latest.apk
          ls -lh dist/AIBrowser-latest.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIBrowser-latest-apk
          path: dist/AIBrowser-latest.apk

      - name: Publish latest APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: Latest AI Browser APK
          files: dist/AIBrowser-latest.apk
          make_latest: true
