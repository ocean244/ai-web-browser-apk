name: Build AI Browser APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode Keystore (if provided)
        if: secrets.ANDROID_KEYSTORE_BASE64 != ''
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && format('{0}/release.keystore', runner.temp) || '' }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          WORKDIR="."
          if [ -d "ai-browser-app" ] && [ -f "ai-browser-app/gradlew" ]; then
            WORKDIR="ai-browser-app"
          fi
          chmod +x "$WORKDIR/gradlew"
          (cd "$WORKDIR" && ./gradlew assembleRelease --no-daemon --stacktrace || (cd "$WORKDIR" && ./gradlew assembleDebug --no-daemon --stacktrace))
          mkdir -p dist
          FOUND_APK=$(find "$WORKDIR" -path "*/build/outputs/apk/*/*.apk" -o -path "*/build/outputs/apk/*.apk" | head -n 1)
          echo "Znaleziony APK: $FOUND_APK"
          test -n "$FOUND_APK"
          cp "$FOUND_APK" dist/AIBrowser-latest.apk
          ls -lh dist/AIBrowser-latest.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIBrowser-latest-apk
          path: dist/AIBrowser-latest.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest AI Browser APK
          files: dist/AIBrowser-latest.apk
          make_latest: true
